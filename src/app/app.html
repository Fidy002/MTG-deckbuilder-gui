<!-- The drifting card art behind the top of every page. -->
<app-card-marquee />

<header>
  <div class="brand">
    <h1>{{ 'app.title' | t }}</h1>
  </div>
  <nav class="tab-bar">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">{{ 'nav.search' | t }}</a>
    <a routerLink="/decks" routerLinkActive="active">{{ 'nav.decks' | t }}</a>
  </nav>
  <app-language-settings />
</header>

<main>
  <router-outlet />
</main>

<footer>
  <small>{{ 'app.attribution' | t }}</small>
</footer>

<app-card-hover-overlay />
